<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>澎湖資訊推薦</title>
<link rel="icon" type="image/png" href="icons/app-icon.png">
<link rel="apple-touch-icon" href="icons/app-icon.png">
<script>
// 嵌入模式（被其他網頁以 iframe 框住）時隱藏頂部 banner
if (window.self !== window.top) document.documentElement.classList.add('embedded');
</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css" />
<style>
  :root {
    color-scheme: light;
    --ui-font: "Microsoft JhengHei", "微軟正黑體", "PingFang TC", "Noto Sans TC", sans-serif;
    --ink: #162e3d;
    --muted: #506473;
    --navy: #19394a;
    --blue: #2468a5;
    --line: #dbe5ea;
    --page: #f2f6f7;
    --paper: #fff;
    --focus: #8e431a;
    --gutter: clamp(14px, 3vw, 34px);
    font-family: var(--ui-font);
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--page); color: var(--ink); }
  button, input { font: inherit; }
  button { cursor: pointer; }
  a { color: var(--blue); text-underline-offset: 3px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .wrap { max-width: 1320px; margin-inline: auto; padding-inline: var(--gutter); }
  .skip { position: absolute; z-index: 1000; inset: 8px auto auto 8px; padding: 10px; background: white; transform: translateY(-140%); }
  .skip:focus { transform: none; }

  .hero { background: var(--navy); color: white; border-bottom: 4px solid #77b9bd; }
  .hero-inner { display: flex; align-items: center; justify-content: space-between; gap: 18px; min-height: 64px; padding-block: 8px; }
  .eyebrow { margin: 2px 0 0; color: #b9e1e0; font-size: .74rem; font-weight: 700; letter-spacing: .13em; }
  h1 { margin: 0; font-size: clamp(1.3rem, 2.4vw, 1.75rem); letter-spacing: .045em; line-height: 1.15; }
  .hero-stat { margin: 0; white-space: nowrap; padding: 5px 10px; border: 1px solid #67969f; border-radius: 9px; color: #e5f4f4; font-size: .82rem; }
  .hero-stat strong { color: white; font-size: .94rem; }
  .embedded .hero { display: none; }
  .hero-side { display: flex; align-items: center; gap: 8px; }
  .login-btn { min-height: 32px; padding: 0 10px; border: 1px solid #67969f; border-radius: 8px; background: transparent; color: #e5f4f4; font-size: .78rem; font-weight: 700; white-space: nowrap; }
  .login-btn:hover { background: #234a5d; }
  .card .field-url a { word-break: break-all; font-size: .74rem; }
  .card-edit { min-height: 30px; }
  .editor { width: min(760px, 94vw); max-height: 94vh; padding: 0; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: var(--paper); }
  .editor::backdrop { background: #0f2633a6; }
  .editor-body { display: grid; gap: 9px; padding: 14px 16px 16px; }
  .editor-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .editor-head h2 { font-size: 1.08rem; overflow-wrap: anywhere; }
  .editor-map { height: min(52vh, 440px); border: 1px solid #b8d2de; border-radius: 10px; background: #c7ddf0; }
  .editor-hint, .editor-coords, .editor-status { margin: 0; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .editor-status.is-error { color: #a1342a; font-weight: 700; }
  .editor-url { display: grid; gap: 4px; font-size: .82rem; font-weight: 750; }
  .editor-url input { min-height: 36px; padding: 0 9px; border: 1px solid #a9bbc5; border-radius: 8px; font-size: .8rem; }
  .editor-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .login-dialog { width: min(360px, 92vw); padding: 0; border: 1px solid var(--line); border-radius: 14px; }
  .login-dialog::backdrop { background: #0f2633a6; }
  #gsi-button { min-height: 44px; display: flex; justify-content: center; }

  main { padding-block: 16px 38px; }
  .layout { display: grid; gap: 15px; }
  .panel { min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 3px 12px #1a3e4c0a; }
  h2 { margin: 0; font-size: 1.22rem; line-height: 1.35; }
  .filters { padding: clamp(13px, 2vw, 19px); }
  .search { display: flex; align-items: center; gap: 8px; min-height: 42px; border: 1px solid #a9bbc5; border-radius: 8px; padding: 0 11px; background: #f8fbfc; }
  .search:focus-within { outline: 2px solid #276c89; outline-offset: 2px; }
  .search-caption { flex: none; color: #334f61; font-size: .77rem; font-weight: 750; white-space: nowrap; }
  .search input { min-width: 0; width: 100%; min-height: 40px; border: 0; outline: 0; background: none; color: var(--ink); }
  .search input::placeholder { color: #5e7382; }
  .results-search { min-width: 0; min-height: 38px; padding-inline: 8px; }
  .results-search input { min-height: 36px; font-size: .82rem; }
  .filter-row { display: grid; grid-template-columns: 5em minmax(0, 1fr); gap: 9px; align-items: start; margin-top: 10px; }
  .filters .filter-row:first-child, .filters .filter-row[hidden] + .filter-row { margin-top: 0; }
  .filter-label { margin: 0; padding-top: 9px; font-size: .83rem; font-weight: 750; color: #334f61; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 0 10px; min-height: 36px; border: 1px solid transparent; border-radius: 7px; white-space: nowrap; color: white; background: var(--tone); font-size: .81rem; font-weight: 750; }
  .chip[data-value=""] { color: #294b60; background: #e8f0f4; border-color: #bed0da; }
  .category-chips .chip { border-radius: 999px; }
  .quick-chips .chip { color: #765215; background: #fbf5e8; border-color: #eacb8d; border-radius: 999px; }
  .quick-chips .chip[aria-pressed="true"] { background: #8a5d1a; color: #fff; box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px #8a5d1a; }
  .quick-status { margin: 7px 0 0; color: var(--muted); font-size: .78rem; }
  .chip[aria-pressed="true"] { box-shadow: inset 0 0 0 2px white, 0 0 0 2px var(--tone); }
  .chip[aria-pressed="true"]::after { content: "✓"; font-size: .78em; }
  .chip:hover { filter: brightness(1.07); }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; background: currentColor; flex: none; }

  .map-panel { padding: clamp(10px, 1.6vw, 17px); }
  .map-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 13px; margin-bottom: 10px; }
  .map-heading { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 12px; }
  .map-status, .results-head p { margin: 0; color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
  .map-frame { position: relative; isolation: isolate; height: clamp(420px, 53vh, 590px); border: 1px solid #b8d2de; border-radius: 10px; overflow: hidden; }
  #map { height: 100%; background: #c7ddf0; font-family: var(--ui-font); }
  .map-unavailable { position: absolute; z-index: 700; bottom: 11px; left: 8px; max-width: calc(100% - 55px); padding: 5px 9px; background: #fff8e9; color: #694718; border: 1px solid #e8cda0; border-radius: 6px; font-size: .74rem; pointer-events: none; }
  .map-credit { position: absolute; z-index: 600; right: 7px; bottom: 7px; color: var(--ink); }
  .map-credit summary { display: grid; place-items: center; width: 26px; height: 26px; margin-left: auto; list-style: none; border: 1px solid #a9c5bd; border-radius: 6px; background: white; font-weight: 750; cursor: pointer; }
  .map-credit summary::-webkit-details-marker { display: none; }
  .map-credit a { display: block; margin-top: 3px; padding: 4px 7px; background: white; border: 1px solid #a9c5bd; border-radius: 6px; font-size: .72rem; }
  .pin-icon { border: none; background: none; }
  .pin-icon .pin-dot { position: absolute; inset: 0; display: grid; place-items: center; color: white; background: var(--pin); border: 2px solid white; border-radius: 50%; font-size: 10px; font-weight: 850; line-height: 1; box-shadow: 0 1px 5px #173a3b60; }
  .pin-icon.route-pin .pin-dot { --pin: #0b3954; font-size: 11px; }
  .route-arrow { background: none; border: none; pointer-events: none; }
  .route-arrow svg { width: 18px; height: 18px; fill: #fff; stroke: #0b3954; stroke-width: 2; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
  .popup-pic { display: block; width: 100%; max-height: 170px; object-fit: cover; border-radius: 8px; margin: 6px 0; background: #e8eef0; }
  .trip-block { margin-top: 8px; }
  .trip-name { margin: 0 0 4px; font-weight: 800; font-size: .85rem; }
  .trip-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
  .trip-grid img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; background: #e8eef0; }
  .route-rule { margin: 4px 2px 8px; font-size: .86rem; line-height: 1.5; color: #334155; font-weight: 700; }
  .badge-role { background: #0b3954; color: #fff; }
  .pin-icon.speed-pin { overflow: visible; }
  .pin-icon.speed-pin .pin-dot { --pin: #dc2626; }
  .pin-icon .pin-dir { position: absolute; left: 14px; top: -12px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); display: grid; place-items: center; pointer-events: none; color: #dc2626; }
  .pin-icon .pin-dir svg { width: 13px; height: 13px; fill: currentColor; transform: rotate(var(--dir)); }
  .pin-icon .pin-limit { position: absolute; left: -2px; top: 17px; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid #dc2626; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: grid; place-items: center; color: #111; font: 900 10px/1 system-ui, sans-serif; pointer-events: none; }
  .pin-icon.is-active .pin-dot { outline: 2px solid var(--navy); outline-offset: 1px; }
  .map-popup .leaflet-popup-content-wrapper { border-radius: 12px; }
  .map-popup .leaflet-popup-content { margin: 13px 15px; line-height: 1.45; }
  .map-popup .leaflet-popup-close-button { font-family: var(--ui-font); width: 28px; height: 28px; line-height: 28px; }
  .popup-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; margin: 0 13px 6px 0; }
  .popup-card h3 { margin: 0; color: #254e78; font-size: 1.05rem; line-height: 1.3; overflow-wrap: anywhere; }
  .popup-card .badge-region { border-radius: 999px; padding-inline: 9px; }
  .popup-card .details-grid { margin: 8px 0 0; gap: 5px 8px; }
  .popup-card .details-grid dt { color: #536a7b; }
  .popup-card .details-grid dd { color: var(--ink); }
  .popup-card .details-grid dd .badge { margin: 0 4px 2px 0; }
  .popup-card .popup-go { display: inline-flex; align-items: center; min-height: 28px; padding: 0 8px; border-radius: 6px; background: #2468a5; color: white; text-decoration: none; white-space: nowrap; font-size: .78rem; font-weight: 750; }
  .popup-card .popup-go:hover { background: #21598f; }
  .popup-card .popup-edit { border: 1px solid #2468a5; background: white; color: #2468a5; }
  .popup-card .popup-edit:hover { background: #eef6f9; }
  .popup-cluster h3 { margin: 0 9px 5px 0; font-size: .91rem; }
  .popup-cluster ul { list-style: none; margin: 0; padding: 0; }
  .popup-cluster li + li { border-top: 1px solid var(--line); }
  .point-button { display: block; width: 100%; padding: 5px 2px; border: 0; background: transparent; color: var(--blue); font: inherit; text-align: left; overflow-wrap: anywhere; }
  .point-button:hover { text-decoration: underline; }

  .results-head { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px 10px; margin: 5px 1px 10px; }
  .results-heading { display: grid; gap: 2px; white-space: nowrap; }
  #results { display: grid; gap: 13px; }
  .group { min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); }
  .group-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 8px; padding: 7px 10px; border-radius: 7px; background: var(--tone); color: white; font-size: .92rem; }
  .group-title span:last-child { font-size: .76rem; }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: stretch; gap: 8px; }

  /* === 店家資訊卡片：每一張自動套用不同配色 === */
  .card:nth-child(12n+1)  { --c-accent: #2563eb; --c-bg: #eff6ff; --c-border: #bfdbfe; }
  .card:nth-child(12n+2)  { --c-accent: #0d9488; --c-bg: #f0fdfa; --c-border: #99f6e4; }
  .card:nth-child(12n+3)  { --c-accent: #7c3aed; --c-bg: #f5f3ff; --c-border: #ddd6fe; }
  .card:nth-child(12n+4)  { --c-accent: #d97706; --c-bg: #fffbeb; --c-border: #fde68a; }
  .card:nth-child(12n+5)  { --c-accent: #e11d48; --c-bg: #fff1f2; --c-border: #fecdd3; }
  .card:nth-child(12n+6)  { --c-accent: #0284c7; --c-bg: #f0f9ff; --c-border: #bae6fd; }
  .card:nth-child(12n+7)  { --c-accent: #16a34a; --c-bg: #f0fdf4; --c-border: #bbf7d0; }
  .card:nth-child(12n+8)  { --c-accent: #ea580c; --c-bg: #fff7ed; --c-border: #fed7aa; }
  .card:nth-child(12n+9)  { --c-accent: #4f46e5; --c-bg: #eef2ff; --c-border: #c7d2fe; }
  .card:nth-child(12n+10) { --c-accent: #c026d3; --c-bg: #fdf4ff; --c-border: #f5d0fe; }
  .card:nth-child(12n+11) { --c-accent: #059669; --c-bg: #ecfdf5; --c-border: #a7f3d0; }
  .card:nth-child(12n+12) { --c-accent: #dc2626; --c-bg: #fef2f2; --c-border: #fecaca; }

  .card {
    min-width: 0;
    display: grid;
    align-content: start;
    gap: 6px;
    padding: 10px 11px;
    border: 1px solid var(--c-border, var(--line));
    border-left: 5px solid var(--c-accent, var(--tone));
    border-radius: 8px;
    background: linear-gradient(90deg, var(--c-bg, #fff) 0%, #ffffff 88%);
    transition: all .18s ease;
  }
  .card.is-selected {
    border-color: var(--c-accent, var(--tone));
    outline: 2px solid var(--c-accent, var(--tone));
    background: var(--c-bg, #fff);
  }
  .card h4 { margin: 0; line-height: 1.35; font-size: 1.03rem; color: var(--c-accent, var(--ink)); overflow-wrap: anywhere; }
  .card-line { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr); align-items: start; gap: 8px; }
  .card-line > :nth-child(2):not(:empty) { border-inline-start: 1px solid var(--c-border, var(--line)); padding-inline-start: 8px; }
  .card-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
  .card-name-line { align-items: baseline; }
  .card-field { margin: 0; color: var(--muted); font-size: .81rem; line-height: 1.5; overflow-wrap: anywhere; }
  .card-field strong { color: var(--ink); font-weight: 750; }
  .badges { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 5px; background: var(--tone); color: white; font-size: .73rem; font-weight: 700; line-height: 1.4; }
  .card .badge-region { background: var(--c-accent, var(--tone)); }
  .badge-island { color: #305d71; background: #e7f2f7; }
  .badge-sub { margin-left: 2px; color: var(--muted); font-size: .73rem; overflow-wrap: anywhere; }
  .desktop-card-title, .desktop-nav-text { display: none; }
  .card-top .card-nav { min-height: 30px; }
  .action { display: inline-flex; align-items: center; justify-content: center; padding: 0 9px; min-height: 35px; border: 1px solid #b3c8d3; border-radius: 7px; background: white; color: #225371; font-size: .78rem; font-weight: 750; text-decoration: none; white-space: nowrap; }
  .action:hover { background: #eef6f9; }
  .action.primary { color: white; background: var(--c-accent, #2468a5); border-color: var(--c-accent, #2468a5); }
  .action.primary:hover { filter: brightness(0.92); }
  .details-grid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 8px; margin: 0; font-size: .8rem; line-height: 1.5; }
  .details-grid dt { font-weight: 750; }
  .details-grid dd { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
  .more { width: 100%; min-height: 37px; margin-top: 8px; color: var(--tone); border-color: var(--tone); }
  .more:hover { background: var(--soft); }
  .empty .action { margin-top: 10px; }
  .empty { margin: 0; padding: 20px; text-align: center; border: 1px dashed #9db4a9; border-radius: 8px; background: white; color: var(--muted); }

  @media (min-width: 900px) {
    body > .hero, main.wrap { width: 75vw; max-width: none; margin-inline: auto; }
    body > .hero { border-radius: 0 0 12px 12px; }
    .hero .wrap { max-width: none; padding-inline: clamp(14px, 2vw, 28px); }
    main.wrap { padding-inline: 0; }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
      gap: 13px;
      height: clamp(560px, 86vh, 1100px);
    }
    .results-panel, .map-panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .results-panel { padding: clamp(8px, 1.1vw, 13px); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 3px 12px #1a3e4c0a; }
    .results-head { flex: none; margin: 1px 1px 9px; }
    #results { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; scrollbar-gutter: stable; align-content: start; padding: 3px 4px 3px 1px; }
    .workspace .cards { grid-template-columns: minmax(0, 1fr); }
    .map-head { flex: none; }
    .map-frame { flex: 1; height: auto; min-height: 0; }
    .card { cursor: pointer; }
    .card:not(.is-selected):not(.open-always) > :not(.card-top) { display: none; }
    .card.has-point:hover { border-color: var(--c-accent, var(--tone)); box-shadow: 0 3px 10px rgba(0,0,0,.08); }
    .desktop-card-title { display: inline; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; overflow-wrap: anywhere; }
    .desktop-card-title:hover { filter: brightness(0.85); }
    .desktop-nav-text { display: inline; }
    .mobile-card-title, .mobile-nav-text { display: none; }
  }
  @media (max-width: 1040px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 899px) {
    .map-panel { display: none; }
    .action, .card-top .card-nav { min-height: 42px; }
    .chip { min-height: 38px; }
    /* 手機端資訊卡片：店名／類別／推薦／營業時間／電話／地址各一行，點卡片即導航 */
    .card { display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
    .card-top, .card-line { display: contents; }
    .card .card-nav, .card .field-dish, .card .card-field:empty, .card .field-url, .card .card-edit, .login-btn, .dataset-row { display: none !important; }
    .card h4 { order: 1; }
    .card .badges { order: 2; }
    .card .field-picks { order: 3; }
    .card .field-hours { order: 4; }
    .card .field-phone { order: 5; }
    .card .field-address { order: 6; }
    .card-line > :nth-child(2):not(:empty) { border-inline-start: 0; padding-inline-start: 0; }
  }
  @media (max-width: 620px) {
    .hero-inner { min-height: 52px; gap: 6px; padding-block: 7px; }
    .hero-stat { padding: 6px 7px; font-size: .69rem; }
    .hero-stat strong { font-size: .78rem; }
    .eyebrow { font-size: .66rem; }
    .filter-row { grid-template-columns: minmax(0, 1fr); gap: 4px; margin-top: 9px; }
    .filter-label { padding-top: 0; }
    .cards { grid-template-columns: minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<a class="skip" href="#content">跳至店家篩選</a>
<header class="hero" aria-labelledby="page-title">
  <div class="wrap hero-inner">
    <div>
      <h1 id="page-title">澎湖資訊推薦<h5 class="eyebrow">澎湖五鄉一市</h5></h1>
    </div>
    <div class="hero-side">
      <p class="hero-stat"><strong id="total-food">–</strong> 筆店家資料</p>
      <button class="login-btn" type="button" id="login">登入</button>
    </div>
  </div>
</header>
<main class="wrap" id="content" tabindex="-1">
  <noscript><p class="empty">請啟用 JavaScript 以使用店家篩選。</p></noscript>
  <div class="layout">
    <section class="panel filters" aria-label="快速關鍵字及主類別篩選">
      <div class="filter-row dataset-row" id="dataset-row" hidden>
        <p class="filter-label" id="dataset-label">修改資料</p>

]);

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function button(text, className, onClick) {
  const node = element('button', className, text);
  node.type = 'button';
  node.addEventListener('click', onClick);
  return node;
}

function webUrl(value) {
  try {
    const url = new URL(value);
    return ['http:', 'https:'].includes(url.protocol) && url.hostname ? url.href : '';
  } catch {
    return '';
  }
}

function externalLink(text, url, className) {
  const node = element('a', className, text);
  node.href = url;
  node.target = '_blank';
  node.rel = 'noopener noreferrer';
  return node;
}

function styleColor(node, palette, value) {
  const [tone, soft] = palette.get(value) || defaultColor;
  node.style.setProperty('--tone', tone);
  node.style.setProperty('--soft', soft);
}

function coordinates(lat, lng) {
  if (lat === '' || lng === '' || lat == null || lng == null) return null;
  const pair = [Number(lat), Number(lng)];
  return Number.isFinite(pair[0]) && Number.isFinite(pair[1]) &&
    Math.abs(pair[0]) <= 90 && Math.abs(pair[1]) <= 180 ? pair : null;
}

function mapsLink(lat, lng) {
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(lat + ',' + lng);
}

function splitCategories(text) {
  return [...new Set(text.split(/[／/、]/).map(part => part.trim()).filter(Boolean))];
}

function searchable(text) {
  return text.normalize('NFKC').toLowerCase().replaceAll('臺', '台');
}

let food = [];
let regionNames = [];
let categoryNames = [];
let foodReady = false;
const state = { quick: '', category: '' };
let matches = [];
let activePoints = [];
let selected = null;
let map;
let penghuBounds;
let markerLayer;
let selectedMarker;
let drawnMarkers = new Map();
const sheetReplies = new Map();
let sheetRequestId = Date.now() % 1000000000;

// 固定回應函式可安全忽略逾時後才到達的回應。
window.penghuFoodSheetReply = response => sheetReplies.get(String(response?.reqId))?.(response);

function fetchSheetRows({ tabId, columns, requiredColumn }) {
  return new Promise((resolve, reject) => {
    const requestId = String(++sheetRequestId);
    const query = new URL('https://docs.google.com/spreadsheets/d/' + foodSheet.spreadsheetId + '/gviz/tq');
    query.searchParams.set('gid', tabId);
    query.searchParams.set('headers', '1');
    query.searchParams.set('tq', 'select ' + columns + ' where ' + requiredColumn + ' is not null');
    query.searchParams.set('tqx', 'out:json;responseHandler:penghuFoodSheetReply;reqId:' + requestId);

    const script = document.createElement('script');
    script.async = true;
    script.src = query.href;
    const timeout = window.setTimeout(() => finish(new Error('讀取逾時')), 15000);

    function finish(error, rows) {
      window.clearTimeout(timeout);
      sheetReplies.delete(requestId);
      script.remove();
      if (error) reject(error);
      else resolve(rows);
    }

    sheetReplies.set(requestId, response => {
      const table = response.table;
      if (response.status === 'error' || !Array.isArray(table?.rows) ||
          table.cols?.length !== columns.split(',').length) {
        finish(new Error('資料格式無法讀取'));
      } else {
        finish(null, table.rows);
      }
    });
    script.addEventListener('error', () => finish(new Error('無法連線')), { once: true });
    document.head.append(script);
  });
}

function sheetCellText(cell) {
  return String(cell?.f ?? cell?.v ?? '').trim();
}

function normalizeRegion(value) {
  const text = value.replace(/\s+/g, '');
  return [...regionPalette.keys()].find(region => text === region || text === region.slice(0, -1)) || text;
}

function distanceKm([fromLat, fromLng], [toLat, toLng]) {
  const radians = Math.PI / 180;
  const h = Math.sin((toLat - fromLat) * radians / 2) ** 2 +
    Math.cos(fromLat * radians) * Math.cos(toLat * radians) *
    Math.sin((toLng - fromLng) * radians / 2) ** 2;
  return 12742 * Math.asin(Math.min(1, Math.sqrt(h)));
}

function locationPoint(point) {
  return point && point[0] > 22 && point[0] < 25 && point[1] > 118 && point[1] < 121;
}

function groupVillageReferences(rows) {
  const references = new Map();
  for (const row of rows) {
    const [region, rawVillage, lat, lng] = Array.from({ length: 4 }, (_, col) => sheetCellText(row?.c?.[col]));
    const village = rawVillage.replace(/[村里]$/, '');
    const point = coordinates(row?.c?.[2]?.v ?? lat, row?.c?.[3]?.v ?? lng);
    if (!village || !locationPoint(point)) continue;
    const key = normalizeRegion(region);
    if (!references.has(key)) references.set(key, []);
    references.get(key).push({ village, point });
  }
  return references;
}

function villageForStore(address, point, refs) {
  const fromAddress = address.match(/(?:馬公市|湖西鄉|白沙鄉|西嶼鄉|望安鄉|七美鄉)([㐀-鿿]{1,3}?)[里村]/)?.[1];
  if (fromAddress || !locationPoint(point)) return fromAddress || '';
  let closest = '';
  let maxDistance = 1.5;
  for (const ref of refs) {
    const distance = distanceKm(point, ref.point);
    if (distance < maxDistance) {
      closest = ref.village;
      maxDistance = distance;
    }
  }
  return closest;
}

function matchesQuickKeyword(item, preset) {
  if (!preset) return true;
  if (preset.regions && !preset.regions.includes(item.region)) return false;
  const excluded = [...(preset.excludeTerms?.[item.region] || []), ...(preset.excludeTerms?.['*'] || [])];
  if (excluded.some(term => item.location.includes(term))) return false;
  if (preset.includeTerms && !preset.includeTerms.some(term => item.location.includes(term))) return false;
  if (preset.anchors && item.tourismKm > preset.radiusKm) return false;
  return !preset.excludePresets?.some(name => matchesQuickKeyword(item, quickKeywords.get(name)));
}

function mapFoodRows(rows, references) {
  return rows.flatMap((row, index) => {
    const cells = row?.c ?? [];
    const [rawRegion, main, subtype, name, dish, picks, phone, address, hours, lat, lng, url] =
      Array.from({ length: 12 }, (_, column) => sheetCellText(cells[column]));
    const point = coordinates(cells[9]?.v ?? lat, cells[10]?.v ?? lng);
    const mapUrl = webUrl(url) || (point ? mapsLink(point[0], point[1]) : '');
    const region = normalizeRegion(rawRegion);
    if (!name || !region || !mapUrl) return [];
    const village = villageForStore(address, point, references.get(region) || []);
    const location = [village, address].filter(Boolean).join(' ');
    const island = region === '馬公市' ? (location + ' ' + name).match(/虎井|桶盤/)?.[0] : '';
    const tourismKm = locationPoint(point) ? Math.min(...cityTourism.anchors.map(anchor => distanceKm(point, anchor))) : Infinity;
    return [{
      id: 'food-' + index, region, tags: splitCategories(main), subtype, name, dish, picks, phone,
      address, hours, point, mapUrl, sheetUrl: url, location, island, tourismKm,
      search: searchable([region, main, subtype, name, dish, picks, address].join(' '))
    }];
  });
}

async function loadFood() {
  byId('query').disabled = true;
  byId('results-count').textContent = '讀取中…';
  byId('map-status').textContent = '讀取中…';
  byId('results').replaceChildren(element('p', 'empty', '正在讀取店家資料…'));
  initializeMap();

  const [storeResult, ...villageResults] = await Promise.allSettled([
    fetchSheetRows(foodSheet),
    ...villageTabs.map(tabId => fetchSheetRows({ tabId, columns: 'A,B,G,H', requiredColumn: 'B' }))
  ]);
  if (storeResult.status !== 'fulfilled') {
    byId('results-count').textContent = '讀取失敗';
    byId('map-status').textContent = '店家資料讀取失敗';
    const notice = element('div', 'empty', '無法讀取店家資料。請確認網路或存取權限後重試。');
    notice.append(element('br'), button('重新讀取', 'action', loadFood));
    byId('results').replaceChildren(notice);
    return;
  }

  const references = groupVillageReferences(villageResults.flatMap(result => result.status === 'fulfilled' ? result.value : []));
  const status = byId('quick-status');
  status.hidden = villageResults.every(result => result.status === 'fulfilled');
  status.textContent = status.hidden ? '' : '部分村里點位讀取失敗，這次依已取得的資料篩選。';
  food = mapFoodRows(storeResult.value, references);
  const regions = new Set(food.map(item => item.region));
  const categories = new Set(food.flatMap(item => item.tags));
  regionNames = [...new Set([...regionPalette.keys(), ...regions])].filter(name => regions.has(name));
  categoryNames = [...new Set([...categoryPalette.keys(), ...categories])].filter(name => categories.has(name));
  byId('total-food').textContent = food.length;
  makeChips('quick-keywords', 'quick', '全部', [...quickKeywords.keys()], new Map());
  makeChips('categories', 'category', '全部主類別', categoryNames, categoryPalette);
  byId('query').disabled = false;
  foodReady = true;
  if (history.state?.foodView) applyView(history.state.foodView);
  else filterFood();
}

function setFilter(field, value) {
  if (state[field] === value) return;
  state[field] = value;
  for (const chip of document.querySelectorAll('button[data-filter="' + field + '"]')) {
    chip.setAttribute('aria-pressed', String(chip.dataset.value === value));
  }
  filterFood();
  saveView(false);
}

// 手機端上一頁：每次切換篩選記一筆瀏覽紀錄，按手機返回鍵先退回前一個篩選畫面，
// 退到最初畫面後再按，回到進入本頁之前的頁面。
const emptyView = { quick: '', category: '', query: '' };
let viewDepth = history.state?.foodView ? history.state.depth : 0;
try {
  if (!history.state?.foodView) history.replaceState({ foodView: emptyView, depth: 0, typing: false }, '');
} catch {}

function saveView(typing) {
  if (desktop.matches) return;
  const view = { quick: state.quick, category: state.category, query: byId('query').value };
  try {
    if (typing && history.state?.typing) {
      history.replaceState({ foodView: view, depth: viewDepth, typing }, '');
    } else {
      history.pushState({ foodView: view, depth: viewDepth + 1, typing }, '');
      viewDepth += 1;
    }
  } catch {}
}

function applyView(view) {
  const known = (field, value) => [...document.querySelectorAll('button[data-filter="' + field + '"]')]
    .some(chip => chip.dataset.value === value);
  state.quick = known('quick', view.quick) ? view.quick : '';
  state.category = known('category', view.category) ? view.category : '';
  for (const chip of document.querySelectorAll('button[data-filter]')) {
    chip.setAttribute('aria-pressed', String(chip.dataset.value === state[chip.dataset.filter]));
  }
  byId('query').value = view.query || '';
  filterFood();
}

window.addEventListener('popstate', event => {
  const entry = event.state?.foodView ? event.state : null;
  viewDepth = entry ? entry.depth : 0;
  if (foodReady) {
    applyView(entry ? entry.foodView : emptyView);
    window.scrollTo(0, 0);
  }
});


function makeChips(id, field, allLabel, values, palette) {
  const root = byId(id);
  for (const value of ['', ...values]) {
    const node = button(value || allLabel, 'chip', () => setFilter(field, value));
    node.dataset.filter = field;
    node.dataset.value = value;
    node.setAttribute('aria-pressed', String(state[field] === value));
    styleColor(node, palette, value);
    if (value && field !== 'quick') {
      const dot = element('span', 'dot');
      dot.setAttribute('aria-hidden', 'true');
      node.prepend(dot);
    }
    root.append(node);
  }
}

function detailLine(root, label, value) {
  if (!value) return;
  const detail = element('dd');
  detail.append(value);
  root.append(element('dt', '', label), detail);
}

function categoryBadge(tag) {
  const badge = element('span', 'badge badge-category', tag);
  styleColor(badge, categoryPalette, tag);
  return badge;
}

function phoneValue(number) {
  const dialable = /^[+\d ()-]+$/.test(number) && number.replace(/\D/g, '').length >= 7;
  if (!dialable) return number;
  const link = element('a', '', number);
  link.href = 'tel:' + number.replace(/[^\d+]/g, '');
  return link;
}

function storeInfo(item) {
  const info = element('dl', 'details-grid');
  detailLine(info, '區域', item.region);
  if (item.sheet === 'speed') {
    detailLine(info, '類型', item.tags.join('・'));
    detailLine(info, '速限', item.speed ? item.speed + ' 公里' : '');
    detailLine(info, '拍攝方向', dirText(item.dir));
    detailLine(info, '取締項目', item.items);
    detailLine(info, '管轄分局', item.unit);
    return info;
  }
  if (item.tags.length || item.subtype) {
    const categories = element('div', 'badges');
    categories.append(...item.tags.map(categoryBadge));
    if (item.subtype && !item.tags.includes(item.subtype)) {
      categories.append(element('span', 'badge-sub', item.subtype));
    }
    detailLine(info, '類別', categories);
  }
  detailLine(info, item.sheet === 'tour' ? '代表服務' : '餐食／服務', item.dish);
  detailLine(info, item.sheet === 'tour' ? '推薦行程' : '推薦', item.picks);
  detailLine(info, '地址', item.address);
  detailLine(info, '電話', phoneValue(item.phone));
  detailLine(info, '營業時間', item.hours);
  return info;
}

// 元宵資訊只在元宵活動前 1 個月起到活動結束前顯示
function lanternSoon(item) {
  const m = String(item.lanternDates || '').match(/(\d{4})\/(\d{1,2})\/(\d{1,2})(?:\s*[-~－至]\s*(\d{4})\/(\d{1,2})\/(\d{1,2}))?/);
  if (!m) return false;
  const start = new Date(+m[1], m[2] - 1, +m[3]);
  const end = m[4] ? new Date(+m[4], m[5] - 1, +m[6]) : new Date(start);
  end.setHours(23, 59, 59);
  const from = new Date(start);
  from.setDate(from.getDate() - 30);
  const now = new Date();
  return now >= from && now <= end;
}

function cardField(label, value, kind) {
  const field = element('p', 'card-field' + (kind ? ' field-' + kind : ''));
  if (value) {
    if (label) field.append(element('strong', '', label + '：'));
    field.append(value);
  }
  return field;
}

function createCard(item) {
  const card = element('article', 'card');
  card.id = item.id;
  card.classList.toggle('is-selected', item === selected);
  styleColor(card, regionPalette, item.region);

  const label = item.sheet === 'route' && item.order ? item.order + '・' + item.name : item.name;
  const name = element('h4');
  name.tabIndex = -1;
  if (item.point) {
    const openOnMap = () => {
      if (desktop.matches) chooseItem(item);
    };
    const nameButton = button(label, 'desktop-card-title', openOnMap);
    nameButton.setAttribute('aria-label', '在地圖查看 ' + item.name);
    name.append(nameButton, element('span', 'mobile-card-title', label));
    card.classList.add('has-point');
  } else {
    name.textContent = label;
  }
  // 電腦端點卡片在地圖上顯示；手機端點卡片直接導航
  card.addEventListener('click', event => {
    if (event.target.closest('a, button')) return;
    if (desktop.matches) {
      chooseItem(item);
    } else {
      const link = externalLink('', item.mapUrl);
      document.body.append(link);
      link.click();
      link.remove();
    }
  });
  const badges = element('div', 'badges');
  if (item.sheet === 'route') {
    if (item.role) badges.append(element('span', 'badge badge-role', item.role));
  }
  if (item.island) badges.append(element('span', 'badge badge-island', '離島（' + item.island + '）'));
  badges.append(...item.tags.map(categoryBadge));
  if (item.subtype && !item.tags.includes(item.subtype)) badges.append(element('span', 'badge-sub', item.subtype));

  const go = externalLink('', item.mapUrl, 'action primary card-nav');
  go.append(element('span', 'desktop-nav-text', '導航'), element('span', 'mobile-nav-text', 'Google 地圖 ↗'));
  go.title = '前往 ' + item.name;

  // 第一行：三欄配置 (店名 │ 類別 │ 導航)
  const top = element('div', 'card-top card-name-line');
  const townLeft = item.sheet === 'speed' || (item.sheet === 'route' && item.town);
  top.style.gridTemplateColumns = (townLeft ? 'auto ' : '') + 'minmax(0, max-content) minmax(max-content, 1fr) auto' + (editor ? ' auto' : '');
  if (townLeft) top.append(element('span', 'badge badge-region', item.sheet === 'route' ? item.town : item.region));
  top.append(name, badges);
  if (item.mapUrl) top.append(go);
  if (editor) {
    const edit = button('修改', 'action card-edit', () => openEditor(item));
    edit.setAttribute('aria-label', '修改 ' + item.name);
    top.append(edit);
  }
  card.append(top);

  // 資訊卡內容：每個類別只顯示指定的欄位
  const kind = item.sheet || 'food';
  if (kind !== 'food') card.classList.add('open-always');   // 美食以外的卡片預設全部展開
  const add = (label, value, cls) => { if (value) card.append(cardField(label, value, cls)); };
  const pair = (a, b) => { if (a.textContent || b.textContent) { const row = element('div', 'card-line'); row.append(a, b); card.append(row); } };
  if (kind === 'food') {
    add('代表餐食', item.dish, 'dish');
    pair(cardField('電話', phoneValue(item.phone), 'phone'), cardField('營業時間', item.hours, 'hours'));
    add('地址', item.address, 'address');
  } else if (kind === 'spot') {
    add('地址', item.address, 'address');
    add('備註', item.desc, 'desc');
  } else if (kind === 'temple') {
    add('主祀', item.deity, 'deity');
    add('地址', item.address, 'address');
    if (item.phone) card.append(cardField('電話', phoneValue(item.phone), 'phone'));
    if (lanternSoon(item)) add('元宵資訊', [item.lanternTheme, item.lanternDates, item.lanternTime, item.lanternContent].filter(Boolean).join('｜'), 'lantern');
  } else if (kind === 'store') {
    add('地址', item.address, 'address');
    if (item.phone) card.append(cardField('電話', phoneValue(item.phone), 'phone'));
  } else if (kind === 'tour') {
    add('代表服務', item.dish, 'dish');
    add('推薦行程', item.picks, 'picks');
    if (item.phone) card.append(cardField('電話', phoneValue(item.phone), 'phone'));
    add('地址', item.address, 'address');
  } else if (kind === 'port') {
    add('地址', item.address, 'address');
    add('簡易說明', item.desc, 'desc');
  } else if (kind === 'speed') {
    pair(cardField('速限', item.speed ? item.speed + ' 公里' : '', 'limit'), cardField('拍攝方向', dirText(item.dir), 'dir'));
    pair(cardField('取締項目', item.items, 'items'), cardField('科技執法種類', item.tech, 'tech'));
  } else if (kind === 'route') {
    add('鄉市／村里', item.village, 'village');
    add('備註', item.note, 'note');
  }

  return card;
}

function groupByRegion(items) {
  const groups = new Map();
  for (const item of items) {
    if (!groups.has(item.region)) groups.set(item.region, []);
    groups.get(item.region).push(item);
  }
  return groups;
}

function renderResults() {
  const root = byId('results');
  const groups = dataset === 'speed' ? new Map([['測速與科技執法', matches]]) : groupByRegion(matches);
  byId('results-count').textContent = '共 ' + matches.length + ' 筆';
  root.replaceChildren();
  root.scrollTop = 0;
  if (!groups.size) {
    root.append(element('p', 'empty', '查無符合條件的店家。可以更換鄉市、主類別或搜尋詞。'));
    return;
  }

  for (const [region, items] of groups) {
    const group = element('section', 'group');
    const title = element('h3', 'group-title');
    title.id = 'group-' + region;
    group.setAttribute('aria-labelledby', title.id);
    title.append(element('span', '', region), element('span', '', items.length + ' 筆'));
    if (dataset === 'speed') title.hidden = true;   // 測速與科技執法不分鄉市，鄉市放在卡片左側
    styleColor(group, regionPalette, region);
    const cards = element('div', 'cards');
    let shown = 0;
    const more = button('', 'action more', () => {
      const firstNew = items[shown];
      expandedRegions.add(region);
      appendCards(items.length);
      byId(firstNew.id)?.querySelector('h4')?.focus();
    });
    more.setAttribute('aria-label', '顯示' + region + '更多店家');

    function appendCards(limit) {
      const next = items.slice(shown, shown + limit);
      cards.append(...next.map(createCard));
      shown += next.length;
      more.hidden = shown === items.length;
      more.textContent = '顯示更多' + region + '店家（剩 ' + (items.length - shown) + ' 筆）';
    }

    appendCards(dataset !== 'food' || expandedRegions.has(region) ? items.length : (groups.size === 1 ? chunkSize : 3));   // 美食以外一次全部顯示
    group.append(title);
    if (dataset === 'route') {
      const ordered = items.filter(i => i.order).sort((a, b) => a.order - b.order);
      if (ordered.length > 1) {
        const mid = ordered.slice(1, -1).map(i => i.name);
        group.append(element('p', 'route-rule', '起點 ' + ordered[0].name + (mid.length ? ' → 沿途 ' + mid.join(' → ') : '') + ' → 終點 ' + ordered[ordered.length - 1].name));
      }
    }
    group.append(cards, more);
    root.append(group);
  }
}

function filterFood() {
  const words = searchable(byId('query').value.trim()).split(/\s+/).filter(Boolean);
  const order = new Map(regionNames.map((region, index) => [region, index]));
  const preset = quickKeywords.get(state.quick);
  matches = currentItems().filter(item =>
    matchesQuickKeyword(item, preset) &&
    (!state.category || item.tags.includes(state.category)) &&
    words.every(word => item.search.includes(word))
  ).sort((a, b) => {
    if (dataset === 'speed') return (Number(a.no) || 9999) - (Number(b.no) || 9999) || a.row - b.row;
    if (dataset === 'route') return String(a.region).localeCompare(String(b.region), 'zh-Hant') || (a.order || 9999) - (b.order || 9999);
    return preset?.anchors ? a.tourismKm - b.tourismKm : (order.get(a.region) ?? 99) - (order.get(b.region) ?? 99);
  });
  setSelection(null);
  expandedRegions.clear();
  renderResults();
  updateMap();
}

function setSelection(item) {
  if (selected) byId(selected.id)?.classList.remove('is-selected');
  selected = item;
  if (item) byId(item.id)?.classList.add('is-selected');
}

function markerContent(item) {
  const card = element('div', 'popup-card');
  styleColor(card, regionPalette, item.region);
  const header = element('div', 'popup-head');
  const go = externalLink('導航', item.mapUrl, 'popup-go');
  go.setAttribute('aria-label', '導航到 ' + item.name);
  header.append(element('h3', '', item.name), go);
  if (editor) {
    header.style.gridTemplateColumns = 'minmax(0, 1fr) auto auto';
    const edit = button('修改', 'popup-go popup-edit', () => {
      map.closePopup();
      openEditor(item);
    });
    edit.setAttribute('aria-label', '修改 ' + item.name);
    header.append(edit);
  }
  card.append(header, element('span', 'badge badge-region', item.region + '・' + datasetLabel(item.sheet)), storeInfo(item));
  if (item.pic) {
    const picUrl = driveImage(item.pic) || (/^https?:\/\//.test(item.pic) ? item.pic : '');
    if (picUrl) {
      const pic = element('img', 'popup-pic');
      pic.src = picUrl; pic.loading = 'lazy'; pic.alt = item.name; pic.referrerPolicy = 'no-referrer';
      card.insertBefore(pic, card.children[1]);
    }
  }
  for (const trip of item.tripImages || []) {
    const block = element('div', 'trip-block');

    for (const url of trip.urls) {
      const img = element('img');
      img.src = url; img.loading = 'lazy'; img.alt = trip.trip || item.name; img.referrerPolicy = 'no-referrer';
      grid.append(img);
    }
    block.append(grid);
    card.append(block);

  return card;
}

function clusterContent(items) {
  const content = element('div', 'popup-cluster');
  const list = element('ul');
  for (const item of items) {
    const row = element('li');
    row.append(button(item.region + '・' + item.name, 'point-button', () => selectPoint(item)));
    list.append(row);
  }
  content.append(element('h3', '', '此處有 ' + items.length + ' 筆店家'), list);
  return content;
}

function fitPoints(points, maxZoom) {
  if (!map || !points.length) return;
  map.fitBounds(points.map(item => item.point), { maxZoom, padding: [38, 38], animate: false });
}

// 電腦端：選取的店家排到清單第一順位並展開；再點一次已選取的店家就收合
function chooseItem(item) {
  if (item === selected) {
    setSelection(null);
    map?.closePopup();
    return;
  }
  if (map && activePoints.includes(item)) selectPoint(item);
  else focusCard(item);
}

// 選取的店家：順序不變，原位展開，清單捲動讓它排在最上方
function focusCard(item) {
  if (!byId(item.id)) {
    expandedRegions.add(item.region);
    renderResults();
  }
  setSelection(item);
  const root = byId('results');
  const card = byId(item.id);
  if (card) root.scrollTop += card.getBoundingClientRect().top - root.getBoundingClientRect().top - 4;
}

function selectPoint(item) {
  if (!map || !activePoints.includes(item)) return;
  focusCard(item);
  map.setView(item.point, 21, { animate: false });
  renderMarkers();
  drawnMarkers.get(item.id)?.openPopup();
}

function renderMarkers() {
  if (!map) return;
  markerLayer.clearLayers();
  drawnMarkers = new Map();
  selectedMarker = null;
  const zoom = map.getZoom();
  const buckets = new Map();
  const bucketSize = zoom < 13 ? 34 : 24;

  const sameSpot = new Map();
  for (const item of activePoints) if (item.sheet === 'speed') {
    const k = item.point.join(',');
    if (!sameSpot.has(k)) sameSpot.set(k, []);
    sameSpot.get(k).push(item);
  }
  for (const list of sameSpot.values()) list.forEach((item, i) => { item.pinShift = list.length > 1 ? Math.round((i - (list.length - 1) / 2) * 30) : 0; });
  for (const item of activePoints) {
    const pixel = map.project(item.point, zoom);
    const key = item.sheet === 'speed' ? 'speed|' + item.id : Math.floor(pixel.x / bucketSize) + ',' + Math.floor(pixel.y / bucketSize);
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(item);
  }

  for (const points of buckets.values()) {
    const isActive = points.includes(selected);
    const item = isActive ? selected : points[0];
    const isGroup = points.length > 1;
    const samePlace = points.every(p => p.point[0] === item.point[0] && p.point[1] === item.point[1]);
    const areas = [...new Set(points.map(point => point.region))];
    const colors = areas.map(area => (regionPalette.get(area) || defaultColor)[0]);
    const tone = colors.length === 1 ? colors[0] : 'conic-gradient(' +
      colors.map((color, i) => color + ' ' + (i / colors.length * 100) + '% ' +
        ((i + 1) / colors.length * 100) + '%').join(', ') + ')';
    const markerTitle = isGroup ? areas.join('、') + '｜' + points.length + ' 筆店家' : item.region + '｜' + item.name;
    const size = isGroup ? (points.length > 9 ? 33 : 27) : (isActive ? 19 : 15);
    const location = isGroup && !isActive ? [
      points.reduce((sum, p) => sum + p.point[0], 0) / points.length,
      points.reduce((sum, p) => sum + p.point[1], 0) / points.length
    ] : item.point;
    const isRoute = !isGroup && item.sheet === 'route' && item.order;
    const isSpeed = !isGroup && item.sheet === 'speed';
    const speedDeg = isSpeed ? directionDeg(item.dir) : null;
    const speedHtml = isSpeed
      ? '<span class="pin-dot">速</span>' +
        (speedDeg === null ? '' : '<span class="pin-dir" style="--dir:' + speedDeg + 'deg" title="' + item.dir + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 20 10.5H14.5V22.5H9.5V10.5H4Z"/></svg></span>') +
        (item.speed ? '<span class="pin-limit" title="速限 ' + item.speed + '">' + item.speed + '</span>' : '')
      : '';
    const marker = L.marker(location, {
      icon: L.divIcon({
        className: 'pin-icon' + (isActive ? ' is-active' : '') + (isSpeed ? ' speed-pin' : '') + (isRoute ? ' route-pin' : ''),
        html: isSpeed ? speedHtml : '<span class="pin-dot" style="--pin:' + tone + '">' + (isGroup ? points.length : (isRoute ? item.order : '')) + '</span>',
        iconSize: isSpeed ? [24, 24] : (isRoute ? [24, 24] : [size, size]),
        ...(isSpeed ? { iconAnchor: [12 - (item.pinShift || 0), 12], popupAnchor: [item.pinShift || 0, -12] } : {})
      }),
      title: isGroup ? markerTitle : '',
      zIndexOffset: isActive ? 1000 : 0,
      riseOnHover: true
    }).addTo(markerLayer);

    const markerEl = marker.getElement();
    markerEl.setAttribute('role', 'button');
    markerEl.setAttribute('aria-label', '查看 ' + markerTitle);
    markerEl.addEventListener('keydown', event => {
      if (event.key === ' ') {
        event.preventDefault();
        marker.fire('click');
      }
    });

    const expands = isGroup && !isActive && zoom < (samePlace ? 14 : 18);
    if (!expands) {
      const content = !isGroup || isActive ? markerContent(item) : clusterContent(points);
      marker.bindPopup(content, {
        className: 'map-popup', minWidth: 250, maxWidth: 315, maxHeight: 310,
        autoPanPadding: [22, 22]
      });
    }

    marker.on('click', () => {
      if (expands) {
        fitPoints(points, samePlace ? 14 : Math.min(18, zoom + 2));
        if (map.getZoom() <= zoom) map.setView(location, zoom + 1, { animate: false });
        return;
      }
      if (!isGroup && zoom < 14) {
        selectPoint(item);
        return;
      }
      selectedMarker?.getElement()?.classList.remove('is-active');
      if (!isGroup || isActive) {
        focusCard(item);
        markerEl.classList.add('is-active');
        selectedMarker = marker;
      } else {
        setSelection(null);
        selectedMarker = null;
      }
    });
    for (const point of points) drawnMarkers.set(point.id, marker);
    if (isActive) selectedMarker = marker;
  }
  drawRouteLines(zoom);
}

// 路線：依控制點順序，沿實際道路從起點連到終點，線上加方向箭頭
const roadCache = new Map();
function roadFor(list) {
  const coords = list.map(i => i.point[1].toFixed(6) + ',' + i.point[0].toFixed(6)).join(';');
  const walking = list.some(i => /步行/.test([i.rule, i.note].join(' ')));
  const cacheKey = (walking ? 'foot|' : 'car|') + coords;
  if (!roadCache.has(cacheKey)) {
    roadCache.set(cacheKey, null);
    const base = walking ? 'https://routing.openstreetmap.de/routed-foot/' : 'https://routing.openstreetmap.de/routed-car/';
    fetch(base + 'route/v1/driving/' + coords + '?overview=full&geometries=geojson&continue_straight=false')
      .then(r => r.json())
      .then(data => {
        const line = data?.routes?.[0]?.geometry?.coordinates;
        if (!line?.length) throw new Error('no route');
        roadCache.set(cacheKey, line.map(([lng, lat]) => [lat, lng]));
        if (dataset === 'route') renderMarkers();
      })
      .catch(() => roadCache.set(cacheKey, false));
  }
  return roadCache.get(cacheKey);
}

function drawRouteLines(zoom) {
  if (dataset !== 'route') return;
  const byArea = new Map();
  for (const item of activePoints.filter(i => i.order)) {
    if (!byArea.has(item.region)) byArea.set(item.region, []);
    byArea.get(item.region).push(item);
  }
  const palette = ['#dc2626', '#2563eb', '#16a34a', '#9333ea', '#ea580c', '#0891b2', '#be185d'];
  let index = 0;
  for (const list of byArea.values()) {
    list.sort((a, b) => a.order - b.order);
    const color = palette[index++ % palette.length];
    if (list.length < 2) continue;
    const road = roadFor(list);
    const line = road || list.map(i => i.point);   // 道路讀取中或失敗時，先用控制點直線連接
    L.polyline(line, { color, weight: 5, opacity: road ? .9 : .45, dashArray: road ? null : '6 8', interactive: false }).addTo(markerLayer);
    if (!road) continue;
    let sinceArrow = 90;
    for (let k = 0; k < line.length - 1; k++) {
      const a = map.project(line[k], zoom), b = map.project(line[k + 1], zoom);
      const length = Math.hypot(b.x - a.x, b.y - a.y);
      sinceArrow += length;
      if (sinceArrow < 120 || length < 4) continue;
      sinceArrow = 0;
      const deg = Math.round(Math.atan2(b.x - a.x, -(b.y - a.y)) * 180 / Math.PI);
      const mid = [(line[k][0] + line[k + 1][0]) / 2, (line[k][1] + line[k + 1][1]) / 2];
      L.marker(mid, { interactive: false, keyboard: false, icon: L.divIcon({ className: 'route-arrow', iconSize: [18, 18],
        html: '<svg viewBox="0 0 24 24" style="transform:rotate(' + deg + 'deg)" aria-hidden="true"><path d="M12 1.5 20 20 12 15.5 4 20Z"/></svg>' }) }).addTo(markerLayer);
    }
  }
}

function updateZoomFloor() {
  if (!desktop.matches) return;
  const size = map.getSize().subtract([overviewPadding * 2, overviewPadding * 2]);
  if (size.x <= 0 || size.y <= 0) return;
  const extent = map.project(penghuBounds.getSouthEast(), 0)
    .subtract(map.project(penghuBounds.getNorthWest(), 0));
  const scale = Math.min(size.x / extent.x, size.y / extent.y);
  const zoom = map.getScaleZoom(scale, 0);
  map.setMinZoom(Math.max(0, Math.floor(zoom / zoomStep) * zoomStep));
}

function showOverview() {
  map.fitBounds(penghuBounds, { padding: [overviewPadding, overviewPadding], animate: false });
}

function initializeMap() {
  if (map || !desktop.matches || !window.L) return;
  penghuBounds = L.latLngBounds(penghuExtent);
  map = L.map('map', {
    attributionControl: false,
    scrollWheelZoom: true,
    maxZoom: 21,
    zoomSnap: zoomStep,
    maxBounds: penghuBounds,
    maxBoundsViscosity: 1
  }).setView(penghuBounds.getCenter(), 9);
  updateZoomFloor();
  showOverview();
  L.control.scale({ metric: true, imperial: false, maxWidth: 90 }).addTo(map);

  const tiles = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/EPSG:3857/{z}/{y}/{x}.jpg', {
    maxNativeZoom: 19,
    maxZoom: 21,
    noWrap: true
  });
  let loadedTiles = 0;
  tiles.on('loading', () => { loadedTiles = 0; });
  tiles.on('tileload', () => { loadedTiles += 1; });
  tiles.on('load', () => { byId('tile-status').hidden = loadedTiles > 0; });
  tiles.addTo(map);

  markerLayer = L.layerGroup().addTo(map);
  map.on('zoomend', renderMarkers);
  map.on('resize', () => {
    const wasOverview = map.getZoom() <= map.getMinZoom();
    updateZoomFloor();
    if (desktop.matches && wasOverview) showOverview();
  });
}

function updateMap() {
  if (!desktop.matches) return;
  initializeMap();
  if (!map) return;
  activePoints = matches.filter(item => item.point && penghuBounds.contains(item.point));
  const area = state.quick || '全部';
  byId('map-status').textContent = area + '・' + activePoints.length + ' 筆可定位店家';
  map.invalidateSize({ pan: false });
  updateZoomFloor();
  if (activePoints.length && (state.quick || byId('query').value.trim())) {
    fitPoints(activePoints, 15);
  } else {
    showOverview();
  }
  renderMarkers();
}


// ===== 電腦端：登入與修改（位置、完整網址寫回原始資料） =====
function decodeToken(token) {
  try {
    const part = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(part))));
  } catch {
    return null;
  }
}

async function callBackend(body) {
  const response = await fetch(editAccess.endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  return response.json();
}

function setEditor(next) {
  editor = next;
  try {
    if (next) sessionStorage.setItem('penghuFoodEditor', JSON.stringify(next));
    else sessionStorage.removeItem('penghuFoodEditor');
  } catch {}
  byId('login').textContent = next ? '登出（' + next.email + '）' : '登入';
  byId('dataset-row').hidden = !next;
  if (!next && dataset !== 'food') {
    switchDataset('food');
    return;
  }
  if (foodReady) renderResults();
  if (map) renderMarkers();
}

function editorValid() {
  return editor && editor.exp * 1000 > Date.now() + 60000;
}

function loadGoogleSignIn() {
  if (window.google?.accounts?.id) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://accounts.google.com/gsi/client';
    script.async = true;
    script.onload = resolve;
    script.onerror = () => reject(new Error('無法載入 Google 登入'));
    document.head.append(script);
  });
}

async function handleCredential(response) {
  const status = byId('login-status');
  status.classList.remove('is-error');
  status.textContent = '確認帳號中…';
  const payload = decodeToken(response.credential);
  try {
    const result = await callBackend({ action: 'check', idToken: response.credential });
    if (!result.ok) throw new Error(result.error || '此帳號沒有修改權限');
    setEditor({ token: response.credential, email: result.email || payload?.email || '', exp: payload?.exp || 0 });
    byId('login-dialog').close();
  } catch (error) {
    status.classList.add('is-error');
    status.textContent = error.message === 'Failed to fetch' ? '無法連線，請稍後再試。' : error.message;
  }
}

async function openLogin() {
  const dialog = byId('login-dialog');
  const status = byId('login-status');
  status.classList.remove('is-error');
  status.textContent = '';
  dialog.showModal();
  if (!editAccess.clientId || !editAccess.endpoint) {
    status.classList.add('is-error');
    status.textContent = '修改功能尚未設定完成。';
    return;
  }
  try {
    await loadGoogleSignIn();
    google.accounts.id.initialize({ client_id: editAccess.clientId, callback: handleCredential, ux_mode: 'popup' });
    byId('gsi-button').replaceChildren();
    google.accounts.id.renderButton(byId('gsi-button'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'zh-TW' });
  } catch (error) {
    status.classList.add('is-error');
    status.textContent = error.message;
  }
}

byId('login').addEventListener('click', () => {
  if (editor) {
    window.google?.accounts?.id?.disableAutoSelect();
    setEditor(null);
  } else {
    openLogin();
  }
});
for (const dialog of document.querySelectorAll('dialog')) {
  dialog.addEventListener('click', event => {
    if (event.target.closest('[data-close]')) dialog.close();
  });
}
try {
  const saved = JSON.parse(sessionStorage.getItem('penghuFoodEditor') || 'null');
  if (saved && saved.exp * 1000 > Date.now() + 60000) setEditor(saved);
} catch {}


function currentItems() {
  return dataset === 'food' ? food : (datasetCache.get(dataset) || []);
}

const DIR_ARROW = { '北': '↑', '南': '↓', '東': '→', '西': '←', '東北': '↗', '西北': '↖', '東南': '↘', '西南': '↙' };
const dirArrow = v => { const m = String(v || '').match(/向\s*(東北|西北|東南|西南|東|西|南|北)/); return m ? DIR_ARROW[m[1]] : ''; };
const dirText = v => v ? (dirArrow(v) + ' ' + v).trim() : '';

// 拍攝方向「東南向西北」換成箭頭角度（北 0°、順時針）
function directionDeg(text) {
  const m = String(text || '').replace(/\s/g, '').match(/^([東西南北]{1,2})[向往]([東西南北]{1,2})$/);
  if (!m) return null;
  const v = { 東: [1, 0], 西: [-1, 0], 南: [0, -1], 北: [0, 1] };
  const [x, y] = [...m[2]].reduce((a, c) => [a[0] + v[c][0], a[1] + v[c][1]], [0, 0]);
  return x || y ? Math.round(Math.atan2(x, y) * 180 / Math.PI) : null;
}

// 測速、行程業者、路線的完整欄位，從公開的試算表分頁補上（修改仍走原本的寫回流程）
const DETAIL_SOURCES = {
  speed: { tabId: '777020', columns: 'A,B,C,E,F,G,H,I,J,K', required: 'C',
    parse: ([type, no, name, lat, lng, speed, dir, items, tech, unit]) => ({ name, lat, lng, type, data: { no, speed, dir, items, tech, unit } }) },
  tour: { tabId: '1358738412', columns: 'D,E,F,H,I,J', required: 'D',
    parse: ([name, dish, picks, phone, address, hours]) => ({ name, data: { dish, picks, phone, address, hours } }) },
  spot: { tabId: '2085392869', columns: 'E,G,H,J,L', required: 'E',
    parse: ([name, lat, lng, pic, desc]) => ({ name, lat, lng, data: { pic, desc } }) },
  port: { tabId: '777001', columns: 'E,G,H,L', required: 'E',
    parse: ([name, lat, lng, desc]) => ({ name, lat, lng, data: { desc } }) },
  temple: { tabId: '2137991614', columns: 'C,D,G,H,J,L,N,O,P', required: 'C',
    parse: ([name, deity, lat, lng, pic, lanternTheme, lanternDates, lanternTime, lanternContent]) => ({ name, lat, lng, data: { deity, pic, lanternTheme, lanternDates, lanternTime, lanternContent } }) },
  route: { tabId: '987631001', columns: 'A,C,D,E,F,G,H,I,O', required: 'E',
    parse: ([area, role, order, name, village, lat, lng, rule, note]) => ({ name, lat, lng, data: { area, role, order: Number(order) || 0, village, rule, note } }) }
};
async function loadDatasetDetails(key) {
  const source = DETAIL_SOURCES[key];
  const rows = await fetchSheetRows({ tabId: source.tabId, columns: source.columns, requiredColumn: source.required });
  const full = new Map(), byName = new Map();
  for (const row of rows) {
    const cells = Array.from({ length: source.columns.split(',').length }, (_, col) => String(row?.c?.[col]?.v ?? row?.c?.[col]?.f ?? '').trim());
    const { name, lat, lng, type, data } = source.parse(cells);
    if (lat !== undefined) full.set(name + '|' + Number(lat) + '|' + Number(lng) + (type !== undefined ? '|' + type : ''), data);
    byName.set(name, byName.has(name) ? null : data);   // 同名重複的不用名稱比對
  }
  return { full, byName };
}
// 行程圖資：同名業者（可有不同行程）的圖片，顯示在地圖資訊視窗
function driveImage(url) {
  const id = String(url).match(/\/d\/([\w-]+)|[?&]id=([\w-]+)/);
  return id ? 'https://drive.google.com/thumbnail?id=' + (id[1] || id[2]) + '&sz=w600' : '';
}
async function loadTripImages() {
  const rows = await fetchSheetRows({ tabId: '1171143381', columns: 'D,E,F,G,H,I,J,K,L,M', requiredColumn: 'D' });
  const byVendor = new Map();
  for (const row of rows) {
    const cells = Array.from({ length: 10 }, (_, col) => String(row?.c?.[col]?.v ?? row?.c?.[col]?.f ?? '').trim());
    const urls = cells.slice(2).map(driveImage).filter(Boolean);
    if (!cells[0] || !urls.length) continue;
    if (!byVendor.has(cells[0])) byVendor.set(cells[0], []);
    byVendor.get(cells[0]).push({ trip: cells[1], urls });
  }
  return byVendor;
}

function mergeDetails(key, items, details) {
  for (const item of items) {
    const typeKey = key === 'speed' ? '|' + (item.tags[0] || '') : '';
    const d = (item.point && details.full.get(item.name + '|' + item.point[0] + '|' + item.point[1] + typeKey)) || (key === 'speed' ? null : details.byName.get(item.name));
    if (!d) continue;
    for (const [field, value] of Object.entries(d)) if (value !== '' && value != null && !item[field]) item[field] = value;
    if (key === 'route' && d.area) item.region = d.area;
    if (key === 'route' && d.village) item.town = d.village.split('／')[0];
    if (key === 'route') item.search += ' ' + searchable([d.area, d.role, d.village].join(' '));
  }
}

function mapSheetData(key, rows) {
  return rows.map(r => {
    const point = coordinates(r.lat, r.lng);
    const [regionPart, villagePart = ''] = String(r.region || '').split('／');
    const region = normalizeRegion(regionPart) || '未分區';
    const location = [villagePart, r.address, r.name].filter(Boolean).join(' ');
    const island = region === '馬公市' ? location.match(/虎井|桶盤/)?.[0] : '';
    return {
      id: key + '-' + r.row, sheet: key, row: r.row, region,
      tags: r.category ? [r.category] : [], subtype: r.subtype || '', name: r.name,
      dish: '', picks: '', phone: r.phone || '', address: r.address || '', hours: '',
      point, sheetUrl: r.url || '', mapUrl: webUrl(r.url) || (point ? mapsLink(point[0], point[1]) : ''),
      location, island,
      tourismKm: locationPoint(point) ? Math.min(...cityTourism.anchors.map(anchor => distanceKm(point, anchor))) : Infinity,
      search: searchable([region, r.category, r.subtype, r.name, r.address, villagePart].join(' '))
    };
  });
}

async function switchDataset(key) {
  if (key === dataset && (key === 'food' || datasetCache.has(key))) return;
  for (const chip of byId('datasets').querySelectorAll('button')) chip.setAttribute('aria-pressed', String(chip.dataset.value === key));
  if (key !== 'food' && !datasetCache.has(key)) {
    byId('results-count').textContent = '讀取中…';
    try {
      if (!editorValid()) throw new Error('登入已過期，請重新登入');
      const result = await callBackend({ action: 'list', sheet: key, idToken: editor.token });
      if (!result.ok) throw new Error(result.error || '讀取失敗');
      const items = mapSheetData(key, result.rows);
      if (DETAIL_SOURCES[key]) mergeDetails(key, items, await loadDatasetDetails(key).catch(() => ({ full: new Map(), byName: new Map() })));
      if (key === 'tour') {
        const images = await loadTripImages().catch(() => new Map());
        // 業者名稱可簡寫：行程圖資寫「和慶」也對得上「和慶遊艇」
        const sameVendor = (x, y) => x === y || (Math.min(x.length, y.length) >= 2 && (x.includes(y) || y.includes(x)));
        for (const item of items) {
          const trips = [...images].filter(([vendor]) => sameVendor(vendor, item.name)).flatMap(([, list]) => list);
          if (trips.length) item.tripImages = trips;
        }
      }
      datasetCache.set(key, items);
    } catch (error) {
      byId('results-count').textContent = error.message === 'Failed to fetch' ? '無法連線，請稍後再試。' : error.message;
      for (const chip of byId('datasets').querySelectorAll('button')) chip.setAttribute('aria-pressed', String(chip.dataset.value === dataset));
      return;
    }
  }
  dataset = key;
  byId('category-row').hidden = key !== 'food';
  byId('results-title').textContent = key === 'food' ? '美食推薦' : datasetLabel(key);
  if (key !== 'food' && state.category) {
    state.category = '';
    for (const chip of document.querySelectorAll('button[data-filter="category"]')) chip.setAttribute('aria-pressed', String(chip.dataset.value === ''));
  }
  filterFood();
}

for (const [key, label] of datasets) {
  const chip = button(label, 'chip', () => switchDataset(key));
  chip.dataset.value = key;
  chip.setAttribute('aria-pressed', String(key === 'food'));
  byId('datasets').append(chip);
}

// 依原本網址決定縮放：原本有 21z 就用 21z，沒有就用 60m（衛星）
function fullUrlFor(lat, lng, original) {
  const pair = lat.toFixed(7) + ',' + lng.toFixed(7);
  const view = /,21z\b/.test(original || '') ? '21z' : '60m/data=!3m1!1e3';
  return 'https://www.google.com/maps/search/' + pair + '/@' + pair + ',' + view;
}

let editMap;
let editMarker;
let editItem = null;

function showEditPoint(latlng, regenerate) {
  const lat = Number(latlng.lat.toFixed(7));
  const lng = Number(latlng.lng.toFixed(7));
  editMarker.setLatLng([lat, lng]);
  byId('editor-coords').textContent = '緯度 ' + lat.toFixed(7) + '　經度 ' + lng.toFixed(7);
  if (regenerate) byId('editor-url').value = fullUrlFor(lat, lng, editItem.sheetUrl);
}

function openEditor(item) {
  if (!editorValid()) {
    setEditor(null);
    openLogin();
    byId('login-status').textContent = '登入已過期，請重新登入。';
    return;
  }
  editItem = item;
  const dialog = byId('editor');
  byId('editor-title').textContent = '修改：' + item.name;
  byId('editor-status').textContent = '';
  byId('editor-status').classList.remove('is-error');
  byId('editor-url').value = item.sheetUrl || '';
  byId('editor-save').disabled = false;
  dialog.showModal();
  const start = item.point || penghuBounds.getCenter();
  if (!editMap) {
    editMap = L.map('editor-map', { attributionControl: false, maxZoom: 21, zoomSnap: 1, maxBounds: L.latLngBounds(penghuExtent), maxBoundsViscosity: 1 });
    L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/EPSG:3857/{z}/{y}/{x}.jpg', { maxNativeZoom: 19, maxZoom: 21, noWrap: true }).addTo(editMap);
    L.control.scale({ metric: true, imperial: false, maxWidth: 90 }).addTo(editMap);
    editMarker = L.marker(start, { draggable: true, autoPan: true }).addTo(editMap);
    editMarker.on('dragend', () => showEditPoint(editMarker.getLatLng(), true));
    editMap.on('click', event => showEditPoint(event.latlng, true));
  }
  editMap.invalidateSize({ pan: false });
  editMap.setView(start, item.point ? 21 : 13, { animate: false });
  showEditPoint(L.latLng(start), false);
}

byId('editor-save').addEventListener('click', async () => {
  const item = editItem;
  const status = byId('editor-status');
  const url = byId('editor-url').value.trim();
  const { lat, lng } = editMarker.getLatLng();
  status.classList.remove('is-error');
  if (!webUrl(url)) {
    status.classList.add('is-error');
    status.textContent = '完整網址格式不正確。';
    return;
  }
  if (!editorValid()) {
    status.classList.add('is-error');
    status.textContent = '登入已過期，請關閉後重新登入。';
    return;
  }
  byId('editor-save').disabled = true;
  status.textContent = '寫回中…';
  try {
    const result = await callBackend({
      action: 'save', idToken: editor.token, sheet: item.sheet || 'food', row: item.row || 0,
      name: item.name, address: item.address,
      oldLat: item.point ? item.point[0] : '', oldLng: item.point ? item.point[1] : '', oldUrl: item.sheetUrl || '',
      lat: Number(lat.toFixed(7)), lng: Number(lng.toFixed(7)), url
    });
    if (!result.ok) throw new Error(result.error || '寫回失敗');
    item.point = [Number(lat.toFixed(7)), Number(lng.toFixed(7))];
    item.sheetUrl = url;
    item.mapUrl = url;
    item.tourismKm = Math.min(...cityTourism.anchors.map(anchor => distanceKm(item.point, anchor)));
    byId('editor').close();
    renderResults();
    if (map) {
      activePoints = matches.filter(entry => entry.point && penghuBounds.contains(entry.point));
      renderMarkers();
    }
  } catch (error) {
    status.classList.add('is-error');
    status.textContent = error.message === 'Failed to fetch' ? '無法連線，請稍後再試。' : error.message;
    byId('editor-save').disabled = false;
  }
});

byId('query').addEventListener('input', () => {
  filterFood();
  saveView(true);
});
byId('fit-map').addEventListener('click', () => {
  if (!map) return;
  setSelection(null);
  showOverview();
  renderMarkers();
});
desktop.addEventListener('change', () => {
  if (desktop.matches) {
    setSelection(null);
    if (foodReady) updateMap();
    else initializeMap();
  }
});
loadFood();
